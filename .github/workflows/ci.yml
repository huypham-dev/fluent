name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # Keep the other OS running, so one failure shows whether it is OS-specific.
      fail-fast: false
      matrix:
        # The app ships only for macOS and Windows.
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runners come with rustup.
      - run: rustup toolchain install stable --profile minimal --component rustfmt
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo build --locked
