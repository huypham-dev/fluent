<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'" />
    <title>Fluent</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1f1f23; }
      body { display: flex; align-items: center; justify-content: space-around; font: 16px system-ui; }
      button { width: 36px; height: 30px; border: 0; border-radius: 6px; background: transparent; color: #fff; font: inherit; cursor: pointer; }
      button:hover { background: #3a3a40; }
    </style>
  </head>
  <body>
    <button data-action="draft" title="Draft reply">✍️</button>
    <button data-action="explain" title="Explain">💡</button>
    <button data-action="translate" title="Translate">🌐</button>
    <script src="bar.js"></script>
  </body>
</html>
