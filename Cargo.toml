[package]
name = "fluent"
version = "0.0.7-beta.1"
edition = "2024"

[dependencies]
dirs = "7.0.0"
global-hotkey = "0.9.0"
humantime = "2.4.0"
png = "0.18.1"
raw-window-handle = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slint = { version = "1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-skia", "compat-1-2", "unstable-winit-030", "accessibility"] }
tempfile = "3.27.0"
tray-icon = "0.26.1"
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[build-dependencies]
slint-build = "1.18.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"

[target."cfg(windows)".dependencies]
clipboard-win = "5.4.3"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_System_LibraryLoader"] }

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
gif = "0.14.2"
slint = { version = "1.18.1", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
